name: Compilar APK Android

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obter codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar ambiente Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar SDK do Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Gerar estrutura nativa mantendo os ficheiros intactos
        run: |
          mkdir -p ../temp_backup
          cp -r lib ../temp_backup/
          cp pubspec.yaml ../temp_backup/
          
          flutter create --org com.leitor.app --project-name leitor_quadrinhos .
          
          cp -r ../temp_backup/lib/* lib/
          cp ../temp_backup/pubspec.yaml pubspec.yaml
          
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle || true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Gerar APK de Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Disponibilizar APK para transferencia
        uses: actions/upload-artifact@v4
        with:
          name: leitor-quadrinhos-apk
          path: build/app/outputs/flutter-apk/app-release.apk
