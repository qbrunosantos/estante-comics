name: Compilar APK Android

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obter codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar ambiente Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar SDK do Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Reconstruir estrutura Android do zero
        run: |
          # 1. Copiar o nosso código para uma pasta temporária
          mkdir -p /tmp/app_code
          cp -r lib /tmp/app_code/
          cp pubspec.yaml /tmp/app_code/
          
          # 2. Criar um projeto Flutter completo e novo
          cd /tmp
          flutter create --org com.leitor.app --platforms android leitor_temp
          
          # 3. Substituir o código e dependências pelos nossos
          cp -r /tmp/app_code/lib/* /tmp/leitor_temp/lib/
          cp /tmp/app_code/pubspec.yaml /tmp/leitor_temp/pubspec.yaml
          
          # 4. Configurar a versão mínima do Android
          cd /tmp/leitor_temp
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle || true

      - name: Instalar dependencias
        run: |
          cd /tmp/leitor_temp
          flutter pub get

      - name: Gerar APK de Release
        run: |
          cd /tmp/leitor_temp
          flutter build apk --release --no-tree-shake-icons

      - name: Disponibilizar APK para transferencia
        uses: actions/upload-artifact@v4
        with:
          name: leitor-quadrinhos-apk
          path: /tmp/leitor_temp/build/app/outputs/flutter-apk/app-release.apk
